<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubo²</title>
    <link rel="stylesheet" href="../CSS/style.css">

    <!-- Aplica el tema guardado instantáneamente al cargar -->
    <script>
        const tema = localStorage.getItem("bubo_tema") || "clasico";
        document.documentElement.classList.add(`tema-${tema}`);
    </script>

</head>
<body>
    <nav class="BarraNav" style="justify-content: flex-start;">
        <div class="menu-central" style="margin-left: 0;">
            <a href="Basico.html"><button type="button">← Regresar</button></a>
        </div>
    </nav>

    <div class="fondoP">
        <div class="tarjeta-perfil">
            <h1>Tu perfil</h1>
            
            <!-- Fila superior: Foto a la izquierda, Nombre y Biografía a la derecha -->
            <div class="perfil-cuerpo">
                <img id="ImgP" alt="Foto de perfil">
                
                <div class="perfil-info">
                    <p id="usuario"></p>
                    <p id="biografia" class="biografia">Escribe tu biografía</p>
                </div>
            </div>

            <!-- Botón posicionado en la esquina inferior derecha -->
            <button id="BTEP">Editar perfil</button>
        </div>

        <!-- Opciones de cuenta actualizadas -->
        <div class="perfil-seccion-opciones">
            <h2 data-trad="opciones_titulo">Opciones de cuenta</h2>
            <div class="perfil-opciones">
                <a href="#" id="btnAbrirConfig" class="opcion-item">
                    <span class="opcion-texto" data-trad="opcion_config">Configuración</span>
                    <span class="flecha">›</span>
                </a>
                <a href="#" id="btnAbrirIdioma" class="opcion-item">
                    <span class="opcion-texto" data-trad="opcion_idioma">Idioma</span>
                    <span class="flecha">›</span>
                </a>
                <a href="Login.html" id="btnCerrarSesion" class="opcion-item opcion-salir">
                    <span class="opcion-texto" data-trad="opcion_salir">Cerrar sesión</span>
                    <span class="flecha">›</span>
                </a>
            </div>
        </div>
    </div>
    

    <!-- POPUP 1: Editar Perfil -->
    <div id="POPUPP" class="popup" style="display: none;">
        <div class="overlay" onclick="CerrarPopupP('POPUPP')"></div>
        <div class="popup-contenido">
            <h2 class="Titulo-Popup">Editar perfil</h2>

            <label>Foto</label>
            <div class="contenedor-foto-popup">
                <img id="ImgPEActual" alt="Foto actual">
                <label for="ImgPE" class="btn-examinar">Elegir archivo</label>
                <input type="file" id="ImgPE" accept="image/*" style="display: none;">
            </div>

            <div class="grupo-campo-izq">
                <label>Nombre de usuario</label>
                <input type="text" id="usuarioE" maxlength="15" minlength="2">

                <label>Biografía</label>
                <textarea id="biografiaE" maxlength="80" rows="3"></textarea>
            </div>

            <button id="BTAEP">Guardar</button>
            <button class="cerrar-popup" onclick="CerrarPopupP('POPUPP')">X</button>
        </div>
    </div>

    <!-- POPUP 2: Configuración (Actualizado con selector de temas visuales) -->
    <div id="POPUP_CONFIG" class="popup" style="display: none;">
        <div class="overlay" onclick="CerrarPopupP('POPUP_CONFIG')"></div>
        <div class="popup-contenido popup-izq">
            <button type="button" class="cerrar-popup" onclick="CerrarPopupP('POPUP_CONFIG')">X</button>
            <h2 class="Titulo-Popup" data-trad="opcion_config">Configuración</h2>
            
            <div class="grupo-campo-izq">
                <label data-trad="config_tema_label">Tema visual de la plataforma</label>
                <select id="selectTema" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #878787; background-color: #b1b2b1; color: #ffffff; font-size: 0.95rem; margin-bottom: 15px;">
                    <option value="clasico">Clásico (Verde & Azul Bubo)</option>
                    <option value="crema">Crema / Cálido</option>
                    <option value="tierra">Tonos Tierra</option>
                </select>

                <label class="fila-check">
                    <span data-trad="config_sonido">Sonidos y efectos en juegos</span>
                    <input type="checkbox" id="checkSonidos" checked>
                </label>
            </div>

            <button type="button" id="btnGuardarConfig" class="btn-derecha" data-trad="btn_guardar">Guardar</button>
        </div>
    </div>

    <!-- POPUP 3: Idioma -->
    <div id="POPUP_IDIOMA" class="popup" style="display: none;">
        <div class="overlay" onclick="CerrarPopupP('POPUP_IDIOMA')"></div>
        <div class="popup-contenido popup-izq">
            <button type="button" class="cerrar-popup" onclick="CerrarPopupP('POPUP_IDIOMA')">X</button>
            <h2 class="Titulo-Popup" data-trad="opcion_idioma">Idioma</h2>
            
            <div class="grupo-campo-izq">
                <label data-trad="idioma_label">Seleccioná el idioma de la plataforma</label>
                <select id="selectIdioma">
                    <option value="es">Español (Argentina)</option>
                    <option value="en">English</option>
                    <option value="pt">Português</option>
                </select>
            </div>

            <button type="button" id="btnGuardarIdioma" class="btn-derecha" data-trad="btn_aplicar">Aplicar</button>
        </div>
    </div>
    
    <!-- Barra Inferior -->
    <div class="BarraBaj">
        <div class="Redes">
            <h3>¡Síguenos!</h3>
            <a class="IT" href="https://www.instagram.com/bubo.arg?dlrf=dzI4aWg2MWhoZWd0">
                <img class="iconos" src="../../assets/instagram.png">
                <p>@bubo.arg</p>
            </a>
            
            <a class="IT">
                <img class="iconos" src="../../assets/tiktok.png">
                <p>Bubo</p>
            </a>
        </div>
        <div class="contacto">
            <h3>Ante cualquier conflicto o consulta</h3>
            <a class="IT">
                <img class="iconos" src="../../assets/gmail.png">
                <p>Bubobubo@gmail.com</p>
            </a>
        </div>
        <img id="imgbb2" src="../../assets/barrabajap.png">
    </div>

    <script src="../JS/Perfil.js"></script>
    <script src="../JS/Animaciones.js"></script>
</body>
</html>
