<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubo²</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JS/Ingreso.js"></script>
</head>
<body class="ingreso">
    <div class="ING">
        <h1>Iniciar sesión</h1>
        <p>Ingrese su nombre de usuario</p>
        <p id="sn"></p>
        <input type="text" id="usuario" maxlength="15" minlength="3">

        <p>Ingrese una foto de perfil (opcional)</p>
        
        <div class="contenedor-archivo">
            <!-- El contenedor fila-selector envuelve al botón y a la foto -->
            <div class="fila-selector">
                <label for="FtoP" class="btn-archivo">Seleccionar archivo</label>
                <img id="preview-img" src="" alt="Vista previa">
            </div>
            
            <!-- El input de archivo va oculto por CSS -->
            <input type="file" id="FtoP" accept="image/*">
            
            <!-- El texto que muestra el nombre del archivo -->
            <span id="texto-archivo">Ningún archivo seleccionado</span>
            
            <button onclick="ValUsua()" class="btn-aceptar">Aceptar</button>
        </div>
    </div>
</body>
    
    <div class="BarraBaj">
        <div class="Redes">
            <h3>¡Síguenos!</h3>
            <a class="IT" href="https://www.instagram.com/bubo.arg?dlrf=dzI4aWg2MWhoZWd0">
                <img class="iconos" src="../../assets/instagram.png">
            <p>@bubo.arg</p></a>
            
            <a class="IT"><img class="iconos" src="../../assets/tiktok.png">
            <p>Bubo</p></a>
        </div>
        <div class="contacto">
            <h3>Ante cualquier conflicto o consulta</h3>
            <a class="IT"><img class="iconos" src="../../assets/gmail.png">
            <p>Bubobubo@gmail.com</p></a>
        </div>
    </div>
   
    <script src="../JS/Animaciones.js"></script>

</body>
</html>
