<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubo²</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script type="module" src="/JS/InicioSesion.js"></script>

    <!-- Aplica el tema guardado instantáneamente al cargar -->
    <script>
        document.documentElement.classList.add("tema-clasico");
    </script>

</head>
<body class="ingreso">
    
    <nav class="BarraNav" style="justify-content: flex-start;">
        <div class="menu-central" style="margin-left: 0;">
            <a href="/index.html"><button type="button">← Regresar</button></a>
        </div>
    </nav>


    <div class="ING">
        <h1>Iniciar sesión</h1>

        <!-- AGREGADO: Campo obligatorio de correo electrónico (ID `email` para `Ingreso.js`) -->
        <p>Ingrese su correo electrónico</p>
        <input type="email" id="emailis" class="input-ingreso" autocomplete="email" required>
        <!-- FIN AGREGADO -->
        <p id="eei"></p>

        <!-- AGREGADO: Campo obligatorio de contraseña propia de la app (no la del mail; ID `password` para `Ingreso.js`) -->
        <p>Ingrese su contraseña</p>
        <input type="password" id="contrais" class="input-ingreso" autocomplete="new-password" required>
        <!-- FIN AGREGADO -->
         <p id="eci"></p>

            <button onclick="ValInicioSesion()" class="btn-aceptar">Aceptar</button>
        </div>
    </div>
    
    <div class="BarraBaj">
        <div class="Redes">
            <h3>¡Síguenos!</h3>
            <a class="IT" href="https://www.instagram.com/bubo.arg?dlrf=dzI4aWg2MWhoZWd0">
                <img class="iconos" src="../../assets/instagram.png">
            <p>@bubo.arg</p></a>
            
            <a class="IT"><img class="iconos" src="../../assets/tiktok.png">
            <p>Bubo</p></a>
        </div>
        <div class="contacto">
            <h3>Ante cualquier conflicto o consulta</h3>
            <a class="IT"><img class="iconos" src="../../assets/gmail.png">
            <p>Bubobubo@gmail.com</p></a>
        </div>
        <img id="imgbb2" src="../../assets/barrabajap.png">
    </div>
   
    <script type="module" src="/JS/Animaciones.js"></script>
